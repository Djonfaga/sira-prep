name: toeflsix
description: "An independent study app for English-proficiency exams (TOEFL & IELTS): practice, vocabulary, and grammar."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.4

  # Fonts (Inter / Outfit via Google Fonts)
  google_fonts: ^6.2.1

  # Speech / TTS for listening + speaking modules
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # AI coach — provider-agnostic OpenAI-compatible client over plain http
  # (works with OpenRouter, Groq, Cerebras, Together, Ollama, …).
  http: ^1.2.2

  # Google Play billing for Pro (subscriptions + lifetime unlock)
  in_app_purchase: ^3.2.0

  # Misc
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0a0f1f"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
